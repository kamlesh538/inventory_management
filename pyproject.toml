[project]
name = "jbhonda"
version = "0.1.0"
description = "Inventory and billing for Jai Bajrang Bali Honda"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1,<4",
    "pyside6>=6.8,<6.11",
    "reportlab>=4.2,<5",
]

[project.scripts]
jbhonda = "jbhonda.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jbhonda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
